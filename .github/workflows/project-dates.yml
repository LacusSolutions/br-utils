name: Sync Project Dates

on:
  schedule:
    - cron: '50 23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log intended field writes without mutating the Project
        type: boolean
        default: true

concurrency:
  group: project-dates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - run: node --test .github/scripts/sync-project-dates.test.js

  sync:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - run: node .github/scripts/sync-project-dates.js
        env:
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECT_OWNER: LacusSolutions
          PROJECT_NUMBER: '1'
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
